[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dupgt-cdr-experiments"
version = "0.2.0"
description = "Books to Movies experiments with DUPGT"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.8.0", "numpy==2.2.6", "orjson==3.11.3", "matplotlib==3.10.6"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
semantics = ["transformers==4.57.6", "huggingface-hub==0.36.2", "safetensors==0.8.0"]

[project.scripts]
dupgt-cdr = "dupgt_cdr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


